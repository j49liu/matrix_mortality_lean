name = "mortality-formalization"
version = "0.1.0"
defaultTargets = ["Mortality"]
fixedToolchain = true
weakLeanArgs = ["-j1"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxHeartbeats = 2000000
maxRecDepth = 10000
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
warningAsError = true

[[require]]
name = "lean_wang"
git = "https://github.com/edemaine/lean-wang.git"
rev = "a6935becf8bdefb026e83b682e2dde620839284c"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "fde9497b2934b0df85407cbf1cf4860195c404c4"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db127794c79fdeb86f6b0cf6ff2c804026fbaff1"

[[lean_lib]]
name = "Mortality"
